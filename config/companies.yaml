# AI universe — company matching targets.
# aliases_ci: case-insensitive word-boundary matches. aliases_cs: case-sensitive
# (used where the lowercase form collides with common words: apple, meta, oracle...).
# private: no listed equity (materiality workstream out of scope for v1).
# Persons are deliberately NOT aliases (controversy-project lesson: person/company
# conflation — e.g. cricket stories polluting Cummins Inc.).
companies:
