# AI Trust Tracker — daily pipeline.
# MANUAL STEP: this file cannot be pushed by API token (GitHub workflow-scope
# restriction). Paste it via the repo web UI: Add file -> .github/workflows/daily.yml
name: daily

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC daily
  workflow_dispatch:            # the dashboard "Update data now" button lands here
  push:
    branches: [main]
    paths:                      # auto-update when the code changes
      - "src/**"
      - "scripts/**"
      - "config/**"
      - "tests/**"

concurrency:
  group: trust-pipeline          # never let two runs race the DB
  cancel-in-progress: false

permissions:
  contents: write                # bot commits the rebuilt dashboard + DB snapshot

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore DB cache (rolling history)
        uses: actions/cache@v4
        with:
          path: data/trust.db
          key: trust-db-${{ github.run_id }}
          restore-keys: trust-db-

      - name: Install deps
        run: pip install requests pyyaml pytest

      - name: Tests
        run: python3 -m pytest tests/ -q

      - name: Daily update (collect, score, combine)
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python3 scripts/daily_update.py

      - name: Build dashboard
        run: python3 scripts/build_dashboard.py

      - name: Commit dashboard + DB snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: daily update ${{ github.run_id }}"
          file_pattern: "docs/index.html data/trust.db"
